<style>
/* Layout: one narrow column, bottom tab bar, cards on a quiet ground. Amounts in the display face; red/green only for owe/get. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16232A; --muted:#5A6B72; --line:#DCE3E1;

  --disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font:700 26px/1.1 var(--disp);margin:6px 0 4px;letter-spacing:-.01em}

h4{font:700 13px var(--disp);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.empty{padding:16px;color:var(--muted)}
.list .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.list .row:last-child{border-bottom:0}
.row.link:active{background:var(--accent-soft)}
.grow{flex:1;min-width:0}
.t{overflow-wrap:anywhere}.s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font:700 16px var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt2{font-size:14px;text-align:right}
.owe{color:var(--bad);font-weight:600}.get{color:var(--good);font-weight:600}.ok{color:var(--muted)}
.chev{color:var(--muted);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats span{display:block;font-size:11px;color:var(--muted)}.stats b{font:700 15px var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mini{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}

.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
/* forms */
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
label small{font-weight:400}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.ng{grid-template-columns:1fr 1fr;align-items:end}.two.ng .btn{grid-column:1/3}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}

.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:last-child{border-bottom:0}

.step{display:flex;align-items:center;gap:6px}
.step button,.rs{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;font-weight:600}
.rs{font-size:16px;width:34px;height:34px;color:var(--muted)}.rs.on{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sv{min-width:62px;text-align:center;font:700 17px var(--disp)}.sv.dim{color:var(--muted)}.sv.off{color:var(--bad);font-size:13px}
.num{width:112px;text-align:right}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip small{color:var(--muted);font-weight:400;margin-left:6px}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on small{color:var(--accent-ink);opacity:.8}
.chip.add{border-style:dashed;color:var(--accent)}
.more{background:none;border:0;text-align:left;color:var(--accent);font-weight:600;padding:2px 0}
.pv{margin-top:12px;padding:12px 14px}.pl{font-weight:600}.pc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px}.pc small{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns.sticky{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;flex:1;min-width:120px}
.btn.big{padding:14px 18px;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}.btn.danger-t{color:var(--bad)}
.btn:disabled{opacity:.45}
.form .btn{flex:none;width:100%}
/* bills */
.bar{display:flex;gap:12px;align-items:center;margin:10px 0}.bar input,.bar select{flex:1}
.bill{display:block;width:100%;text-align:left;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.bill.done{opacity:.65}
.b1{display:flex;justify-content:space-between;gap:10px}.bw{font-weight:700;overflow-wrap:anywhere}.ba{font:700 16px var(--disp);font-variant-numeric:tabular-nums}
.b2{color:var(--muted);font-size:13px;margin-top:2px}.b3{color:var(--bad);font-size:13px;margin-top:3px}

/* statement */
.ab{display:grid;grid-template-columns:1fr;gap:10px}

.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln b{font-variant-numeric:tabular-nums}.ln.tot{border-bottom:0;font-weight:700;padding-top:8px}.ln.hid{display:none}
.res{margin-top:10px;border-radius:14px;padding:14px;text-align:center}
.res.pay{background:var(--bad-soft);color:var(--bad)}.res.get{background:var(--good-soft);color:var(--good)}.res.ok{background:var(--accent-soft);color:var(--accent)}
.res .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.res small{display:block;font-size:12px;opacity:.85}.res b{font:700 24px var(--disp);font-variant-numeric:tabular-nums}
.res p{margin:8px 0 0;font-weight:700;font-size:16px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}th{font-weight:700;color:var(--muted);font-size:12px}
tr.tt td{font-weight:700;border-bottom:0}
/* nav, toast, modal */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}

#toast[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:9;max-width:92vw;font-weight:600;font-size:14px}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;filter:brightness(1.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet textarea{font-size:13px}

.chipsync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin:0 0 6px;max-width:100%;text-align:left}
.chipsync i,.stline i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.chipsync.ok i,.stline.ok i{background:var(--good)}.chipsync.wait i,.stline.wait i{background:#E0A100}.chipsync.bad i,.stline.bad i{background:var(--bad)}
.stline{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.mini{transition:background .15s}}

.sfilter{gap:10px}.who{display:flex;align-items:center;gap:10px}.who select{font-weight:700}

.res{border-radius:20px;padding:16px 14px;margin-top:12px}

.ab{gap:12px}.blk{border-radius:18px;box-shadow:var(--shadow);padding:13px 15px}

<style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}main{padding-top:calc(18px + env(safe-area-inset-top,0px))}</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
const SEED = {"v":1,"hub":"","people":[],"guests":[],"expenses":[],"payments":[]};
/* ===== ENGINE: same rules as the workbook ===== */
const N = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
const clean = s => String(s == null ? '' : s).replace(/\s/g, '').toLowerCase();
const dnum = s => (s ? Date.parse(s + 'T00:00:00Z') / 86400000 : null);
const has = v => !(v === undefined || v === null || v === '');

/* a typed fixed amount: 200 = fixed only, "200+" = fixed AND an equal share of the rest */
function fixedOf(v) {
  if (typeof v === 'number') return { amt: isFinite(v) ? v : 0, plus: false };
  const t = String(v == null ? '' : v).trim();
  if (/\+$/.test(t)) { const a = parseFloat(t.slice(0, -1)); return { amt: isFinite(a) ? a : 0, plus: true }; }
  return { amt: N(t), plus: false };
}
/* the Guests cell: "Ujjwal=40, Darsh, Kamal=25+" -> [{name, key, amt, plus, bad}] */
function guestTokens(txt) {
  return String(txt || '').split(/[,;\n]/).map(t => t.trim()).filter(Boolean).map(t => {
    const i = t.indexOf('=');
    if (i < 0) return { name: t, key: clean(t), mode: 0, amt: 0 };
    const nm = t.slice(0, i).trim(), raw = t.slice(i + 1).replace(/\s/g, '');
    const plus = /\+$/.test(raw), a = Number(plus ? raw.slice(0, -1) : raw);
    if (raw === '' || !isFinite(a) || a < 0) return { name: nm, key: clean(nm), mode: 9, amt: 0 };
    return { name: nm, key: clean(nm), mode: plus ? 2 : 1, amt: a };
  });
}
function modeOf(e) { return e.split === 'Exact' ? 'Exact' : e.split === 'Fixed+Equal' ? 'Mixed' : 'Equal'; }

/* one bill -> shares */
function billCalc(S, e) {
  const people = S.people.filter(p => p.name);
  const A = N(e.amount), mode = modeOf(e), dn = dnum(e.date);
  const pnames = people.map(p => p.name);
  const payers = pnames.concat(S.guests.filter(g => g.name).map(g => g.name));
  // guests attending
  const attend = [];
  if (mode !== 'Exact' && e.guests) {
    const toks = guestTokens(e.guests).map(t => t.key);
    S.guests.forEach(g => {
      if (g.name && toks.indexOf(clean(g.name)) >= 0 && g.sponsor && pnames.indexOf(g.sponsor) >= 0) attend.push(g);
    });
  }
  const unknownGuests = [];
  if (mode !== 'Exact' && e.guests) {
    guestTokens(e.guests).forEach(tk => {
      const t = tk.name, g = S.guests.find(g => clean(g.name) === clean(t));
      if (!g || !g.sponsor || pnames.indexOf(g.sponsor) < 0) unknownGuests.push(t);
    });
  }
  const gs = {}, gAll = {}, ts = {}, own = {}, val = {};
  const gspec = {}; if (mode !== 'Exact') guestTokens(e.guests).forEach(tk => { gspec[tk.key] = tk; });
  /* a guest typed Name=40 pays only that and is NOT counted in the equal split; Name=40+ pays that AND an equal share; a plain name is an equal share */
  people.forEach(p => { const mine = attend.filter(g => g.sponsor === p.name); gAll[p.name] = mine.length; gs[p.name] = mine.filter(g => (gspec[clean(g.name)] || { mode: 0 }).mode !== 1).length; });
  const plus = {};
  let fx = 0, otot = 0;
  people.forEach(p => {
    const v = (e.heads || {})[p.name];
    val[p.name] = v;
    const excl = dn !== null && ((p.from_ && dn < dnum(p.from_)) || (p.until && dn > dnum(p.until)));
    let t;
    if (mode === 'Exact') t = N(v);
    else if (!has(v)) t = (excl ? 0 : N(p.heads)) + gs[p.name];
    else if (mode === 'Mixed') { const f = fixedOf(v); plus[p.name] = f.plus; t = gs[p.name] + (f.plus && !excl ? N(p.heads) : 0); }
    else t = Math.max(N(v), gs[p.name]);
    ts[p.name] = t; otot += t;
    if (mode === 'Mixed') fx += fixedOf(v).amt;
  });
  attend.forEach(g => { const sp = gspec[clean(g.name)]; if (sp && (sp.mode === 1 || sp.mode === 2)) fx += sp.amt; });
  const perh = (A === 0 || otot === 0 || mode === 'Exact') ? 0 : (A - fx) / otot;
  const guestShare = {}, gsAmt = {};
  let gCust = 0;
  attend.forEach(g => {
    const sp = gspec[clean(g.name)] || { mode: 0 };
    let a = perh; if (sp.mode === 1) a = sp.amt; else if (sp.mode === 2) a = sp.amt + perh;
    if (sp.mode > 0) gCust++;
    if (A === 0) a = 0;
    guestShare[g.name] = a; gsAmt[g.sponsor] = (gsAmt[g.sponsor] || 0) + a;
  });
  people.forEach(p => {
    if (A === 0) own[p.name] = 0;
    else if (mode === 'Exact') own[p.name] = ts[p.name];
    else own[p.name] = (mode === 'Mixed' ? fixedOf(val[p.name]).amt : 0) + (otot === 0 ? 0 : perh * (ts[p.name] - gs[p.name]));
  });
  const gTot = attend.length;
  // payers
  const p2ok = e.paid2 && payers.indexOf(e.paid2) >= 0;
  const a2 = p2ok ? Math.min(N(e.amt2), A) : 0;
  const a1 = A - a2;
  // problems
  const warn = [];
  if (!e.date) warn.push('Enter a date');
  if (!A) warn.push('Enter the amount');
  if (A && payers.indexOf(e.paid) < 0) warn.push('Choose who paid');
  if (e.paid2 && !p2ok) warn.push('Choose the 2nd payer from the list');
  if (p2ok && e.paid2 === e.paid) warn.push('2nd payer is the same person');
  if (p2ok && (N(e.amt2) <= 0 || N(e.amt2) >= A)) warn.push('2nd payer amount must be more than 0 and less than the bill');
  if (!e.paid2 && N(e.amt2) > 0) warn.push('Choose who paid the 2nd part');
  if (mode !== 'Exact' && guestTokens(e.guests).some(t => t.mode === 9)) warn.push('A guest amount is not a number - write Name=40 or Name=40+');
  if (unknownGuests.length) warn.push('Guest not found or has no friend selected: ' + unknownGuests.join(', '));
  if (A) {
    if (mode === 'Exact') { if (Math.abs(A - otot) >= 0.01) warn.push('Amounts differ from the bill by ' + (A - otot).toFixed(2)); }
    else if (mode === 'Mixed') {
      if (fx === 0) warn.push('Type a fixed amount for at least one person (or use Equal)');
      else if (fx > A + 0.005) warn.push('Fixed amounts (' + fx.toFixed(2) + ') are more than the bill');
      else if (otot === 0 && Math.abs(A - fx) >= 0.01) warn.push('Nobody is left to share the remaining ' + (A - fx).toFixed(2));
    } else if (otot === 0) warn.push('Nobody is sharing');
  }
  return { A, mode, gs, gAll, ts, own, perh, otot, fx, attend, guestShare, gsAmt, plus, gCust, gTot, a1, a2, p2: p2ok ? e.paid2 : '', warn, val };
}

/* everything */
function compute(S) {
  const people = S.people.filter(p => p.name);
  const guests = S.guests.filter(g => g.name);
  const pnames = people.map(p => p.name);
  const bills = S.expenses.map(e => ({ e, c: billCalc(S, e) }));
  const ent = [];
  people.forEach(p => ent.push({ name: p.name, guest: false, sponsor: '', via: p.name, open: N(p.open), paid: 0, share: 0, sent: 0, recv: 0 }));
  guests.forEach(g => {
    const sp = g.sponsor && pnames.indexOf(g.sponsor) >= 0 ? g.sponsor : '';
    ent.push({ name: g.name, guest: true, sponsor: sp, via: sp || g.name, open: N(g.open), paid: 0, share: 0, sent: 0, recv: 0 });
  });
  const byName = {};
  ent.forEach(x => { if (!byName[x.name]) byName[x.name] = x; });
  bills.forEach(({ e, c }) => {
    if (c.a1 && byName[e.paid]) byName[e.paid].paid += c.a1;
    if (c.a2 && byName[c.p2]) byName[c.p2].paid += c.a2;
    people.forEach(p => { byName[p.name].share += c.own[p.name]; });
    Object.keys(c.guestShare).forEach(n => { if (byName[n]) byName[n].share += c.guestShare[n]; });
  });
  S.payments.forEach(p => {
    const a = N(p.amount); if (a <= 0) return;
    if (byName[p.from_]) byName[p.from_].sent += a;
    if (byName[p.to]) byName[p.to].recv += a;
  });
  ent.forEach(x => { x.net = r2(x.open + x.paid - x.share + x.sent - x.recv); });
  // plan
  const plan = [];
  people.forEach(p => {
    if (p.name === S.hub) return;
    const grp = ent.filter(x => x.via === p.name);
    const O = r2(grp.reduce((s, x) => s + x.net, 0));
    if (Math.abs(O) < 0.005) return;
    const own = byName[p.name];
    let det = 'Own: ' + (own.net < -0.004 ? 'owes ' : 'gets ') + Math.abs(own.net).toFixed(2);
    const gl = ent.filter(x => x.guest && x.sponsor === p.name && Math.abs(x.net) >= 0.005);
    gl.forEach(x => { det += '; ' + x.name + (x.net < -0.004 ? ' owes ' : ' gets ') + Math.abs(x.net).toFixed(2); });
    plan.push({ person: p.name, from: O < 0 ? p.name : S.hub, to: O < 0 ? S.hub : p.name, amount: Math.abs(O), detail: gl.length ? det : '' , net: O });
  });
  const groupNet = {};
  people.forEach(p => { groupNet[p.name] = r2(ent.filter(x => x.via === p.name).reduce((s, x) => s + x.net, 0)); });
  // the hub's own guests settle directly with the hub (same as the workbook's Dashboard cards)
  const hubGuests = ent.filter(x => x.guest && x.sponsor === S.hub);
  const guestToHub = hubGuests.reduce((s, x) => s + (x.net < -0.004 ? -x.net : 0), 0);
  const guestFromHub = hubGuests.reduce((s, x) => s + (x.net > 0.004 ? x.net : 0), 0);
  return { people, guests, bills, ent, byName, plan, groupNet, guestToHub, guestFromHub };
}

/* one person's statement.  opts = { from:'YYYY-MM-DD'|'', to:'', trip:'' }
   A trip means: only that trip's bills and its total - no dates, no opening/closing balance, no payments. */
const effd = s => { const d = dnum(s); return d === null ? 1e9 : d; };
function statement(S, R, name, opts) {
  const me = R.byName[name]; if (!me) return null;
  opts = opts || {};
  const tripName = (opts.trip && opts.trip !== 'All trips') ? String(opts.trip).trim() : '';
  const trip = tripName.toLowerCase();
  const tripMode = !!trip;
  const FROM = (!tripMode && opts.from) ? dnum(opts.from) : -1e9, TO = (!tripMode && opts.to) ? dnum(opts.to) : 1e9;
  const inGroup = n => { const x = R.byName[n]; if (!x) return false; return me.guest ? x.name === name : x.via === name; };
  const grp = R.ent.filter(x => me.guest ? x.name === name : x.via === name);
  const opening0 = grp.reduce((s, x) => s + x.open, 0);
  const tripOf = e => String(e.trip || '').trim().toLowerCase();
  let sharePre = 0, paidPre = 0, sharePer = 0, ownPer = 0, paidPer = 0, tripTotal = 0;
  const bills = [];
  const T = { amount: 0, own: 0, guests: 0, share: 0, paid: 0 };
  R.bills.forEach(({ e, c }, idx) => {
    if (!c.A) return;
    if (tripMode && tripOf(e) === trip) tripTotal += c.A;
    let own, grpShare;
    if (me.guest) { own = c.guestShare[name] || 0; grpShare = own; }
    else { own = c.own[name] || 0; grpShare = own + (c.gsAmt[name] || 0); }
    const p1 = inGroup(e.paid), p2 = c.a2 > 0 && inGroup(c.p2);
    const paidBy = (p1 ? c.a1 : 0) + (p2 ? c.a2 : 0);
    const d = effd(e.date);
    if (d < FROM) { sharePre += grpShare; paidPre += paidBy; return; }
    if (d > TO) return;
    if (trip && tripOf(e) !== trip) return;
    sharePer += grpShare; ownPer += own; paidPer += paidBy;
    if (!(grpShare > 0.00001 || p1 || p2)) return;
    let heads;
    if (me.guest) heads = 1;
    else if (c.mode === 'Exact') heads = 'Exact';
    else if (c.plus && c.plus[name]) heads = 'Fixed+' + (c.ts[name] - c.gs[name]);
    else if (c.mode === 'Mixed' && c.ts[name] - c.gs[name] === 0 && own > 0) heads = 'Fixed';
    else heads = c.ts[name] - c.gs[name];
    const b = { e, d, ord: idx, date: e.date, what: e.what, trip: e.trip || '', paidText: e.paid + (c.a2 > 0 ? ' + ' + c.p2 : ''), amount: c.A, heads, own,
      guestsShare: grpShare - own, share: grpShare, paid: paidBy, result: paidBy - grpShare };
    bills.push(b);
    T.amount += c.A; T.own += own; T.guests += grpShare - own; T.share += grpShare; T.paid += paidBy;
  });
  bills.sort((x, y) => x.d - y.d || x.ord - y.ord);
  bills.forEach((b, i) => { b.n = i + 1; });
  // payments (not in trip view)
  let madePre = 0, recvPre = 0, madePer = 0, recvPer = 0;
  const made = [], recv = [];
  if (!tripMode) S.payments.forEach((p, idx) => {
    const a = N(p.amount); if (a <= 0) return;
    const f = inGroup(p.from_), t = inGroup(p.to);
    if (f === t) return;
    const d = effd(p.date);
    if (d < FROM) { if (f) madePre += a; else recvPre += a; return; }
    if (d > TO) return;
    const row = { p, d, ord: idx, date: p.date, note: p.note || '', from: p.from_, to: p.to, amount: a };
    if (f) { madePer += a; made.push(row); } else { recvPer += a; recv.push(row); }
  });
  made.sort((x, y) => x.d - y.d || x.ord - y.ord);
  recv.sort((x, y) => x.d - y.d || x.ord - y.ord);
  const opening = tripMode ? 0 : r2(opening0 + paidPre - sharePre + madePre - recvPre);   // + gets back, - owes
  const closing = tripMode ? 0 : r2(opening + paidPer - sharePer + madePer - recvPer);
  const A = { oldOwed: Math.max(0, -opening), own: ownPer, guests: sharePer - ownPer, recvBack: recvPer };
  A.total = A.oldOwed + A.own + A.guests + A.recvBack;
  const B = { oldCredit: Math.max(0, opening), bills: paidPer, made: madePer };
  B.total = B.oldCredit + B.bills + B.made;
  const diff = tripMode ? 0 : r2(A.total - B.total);
  const toPay = Math.max(0, diff), toGet = Math.max(0, -diff);
  const payVia = me.guest ? me.sponsor : (name === S.hub ? '' : S.hub);
  // guests block (not in trip view)
  const gl = (me.guest || tripMode) ? [] : R.ent.filter(x => x.guest && x.sponsor === name).map(x => {
    let spre = 0, sper = 0, bpre = 0, bper = 0;
    R.bills.forEach(({ e, c }) => {
      const sh = c.guestShare[x.name] || 0;
      const pd = (e.paid === x.name ? c.a1 : 0) + (c.p2 === x.name ? c.a2 : 0);
      if (!sh && !pd) return;
      const d = effd(e.date);
      if (d < FROM) { spre += sh; bpre += pd; } else if (d <= TO) { sper += sh; bper += pd; }
    });
    let sPre = 0, rPre = 0, sPer = 0, rPer = 0;
    S.payments.forEach(p => {
      const a = N(p.amount); if (a <= 0) return; const d = effd(p.date);
      if (d < FROM) { if (p.from_ === x.name) sPre += a; if (p.to === x.name) rPre += a; }
      else if (d <= TO) { if (p.from_ === x.name) sPer += a; if (p.to === x.name) rPer += a; }
    });
    const ob = r2(x.open - spre + bpre + sPre - rPre), paidP = r2(bper + sPer - rPer), now = r2(ob - sper + paidP);
    return { name: x.name, startBal: ob, share: sper, paid: paidP, now, collect: Math.max(0, -now), giveBack: Math.max(0, now) };
  });
  const hasGuests = !me.guest && R.ent.some(x => x.guest && x.sponsor === name);
  return { name, me, opts, tripMode, tripName, tripTotal, A, B, diff, toPay, toGet, payVia, gl, hasGuests, bills, made, recv, opening, closing, groupNet: R.groupNet[name],
    totals: T, madeTotal: madePer, recvTotal: recvPer };
}

/* trips summary */
function tripsSummary(S, R) {
  const m = {};
  R.bills.forEach(({ e, c }) => {
    const t = String(e.trip || '').trim(); if (!t || !c.A) return;
    const k = t.toLowerCase();
    const o = m[k] || (m[k] = { name: t, bills: 0, total: 0, first: '', last: '' });
    o.bills++; o.total += c.A;
    if (e.date) { if (!o.first || e.date < o.first) o.first = e.date; if (!o.last || e.date > o.last) o.last = e.date; }
  });
  return Object.keys(m).map(k => m[k]).sort((a, b) => (b.last || '').localeCompare(a.last || ''));
}
function tripNames(S) {
  const seen = {}, out = [];
  S.expenses.forEach(e => { const t = String(e.trip || '').trim(); if (t && !seen[t.toLowerCase()]) { seen[t.toLowerCase()] = 1; out.push(t); } });
  return out;
}

function resultSentence(st) {
  if (st.tripMode) return 'Trip ' + st.tripName + ': the group spent AED ' + fmt(st.tripTotal) + ' in total. Your total share is AED ' + fmt(st.totals.share) + '.';
  if (st.toPay > 0.004) return 'You need to pay AED ' + fmt(st.toPay) + (st.payVia ? ' to ' + st.payVia + '.' : ' to your friends (see Home for who).');
  if (st.toGet > 0.004) return st.payVia ? st.payVia + ' will pay you AED ' + fmt(st.toGet) + '.' : 'AED ' + fmt(st.toGet) + ' is due to you.';
  return 'All settled. Nothing to pay.';
}
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

/* month-wise */
function monthly(S, R, year) {
  const people = R.people.map(p => p.name);
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const o = { m, share: {}, guests: 0, spent: 0, paid: {} };
    people.forEach(n => { o.share[n] = 0; o.paid[n] = 0; });
    R.bills.forEach(({ e, c }) => {
      if (!e.date || +e.date.slice(0, 4) !== year || +e.date.slice(5, 7) !== m) return;
      o.spent += c.A;
      people.forEach(n => { o.share[n] += c.own[n] || 0; });
      Object.keys(c.guestShare).forEach(g => { o.guests += c.guestShare[g]; });
      const gp = n => { const x = R.byName[n]; return x ? x.via : n; };
      if (c.a1 && o.paid[gp(e.paid)] !== undefined) o.paid[gp(e.paid)] += c.a1;
      if (c.a2 && o.paid[gp(c.p2)] !== undefined) o.paid[gp(c.p2)] += c.a2;
    });
    rows.push(o);
  }
  return rows;
}

</script>
<script>
/* ===== APP ===== */
const KEY = 'gxt.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dshow = s => s ? (s.slice(8, 10) + ' ' + MON[+s.slice(5, 7) - 1] + ' ' + s.slice(2, 4)) : 'no date';
const APP_VERSION = '11.0 · 18 Oct 2026';
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- storage ---------- */
let S = null, storageOK = true, DL = null;
const HOSTED = !(window.claude && window.claude.use);
let SY = { url: '', token: '', lastSync: 0, lastError: '' }, OB = [], syncing = false;
function loadSY() { try { const x = JSON.parse(localStorage.getItem('gxt.sync') || 'null'); if (x) SY = Object.assign(SY, x); const o = JSON.parse(localStorage.getItem('gxt.outbox') || '[]'); if (Array.isArray(o)) OB = o; } catch (e) { } }
function saveSY() { try { localStorage.setItem('gxt.sync', JSON.stringify(SY)); } catch (e) { } }
function saveOB() { try { localStorage.setItem('gxt.outbox', JSON.stringify(OB)); } catch (e) { } }
const syncOn = () => HOSTED && !!(SY.url && SY.token);
function load() {
  try {
    const t = localStorage.getItem(KEY);
    if (t) { const x = JSON.parse(t); if (x && x.people) return x; }
  } catch (e) { storageOK = false; }
  const x = JSON.parse(JSON.stringify(SEED));
  x.meta = { lastBackup: null, changes: 0, seeded: true };
  x.prefs = {};
  return x;
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; }
}
function commit() { S.meta.changes = (S.meta.changes || 0) + 1; persist(); }

/* ---------- ui state ---------- */
const UI = { view: 'home', stmt: '', stmtFrom: '', stmtTo: '', stmtTrip: '', bill: null, q: '', tripQ: '', year: new Date().getFullYear(), toast: null, modal: null, confirm: null, restoreText: '' };
let F = null, PF = null, R = null;
function recalc() { R = compute(S); }
function go(v, extra) { UI.view = v; UI.confirm = null; if (extra) Object.assign(UI, extra); render(); window.scrollTo(0, 0); }

/* ---------- helpers ---------- */
const hue = n => { let h = 7; String(n || '').split('').forEach(c => { h = (h * 31 + c.charCodeAt(0)) % 360; }); return h; };
const av = (n, cls) => '<span class="av ' + (cls || '') + '" style="--h:' + hue(n) + '">' + esc(String(n || '?').trim().slice(0, 1).toUpperCase()) + '</span>';
const tripTag = t => t ? '<span class="trip">' + esc(t) + '</span>' : '';
const balText = v => v < -0.004 ? 'You owe ' + fmt(-v) : v > 0.004 ? 'Others owe you ' + fmt(v) : 'Nil';
const balCls = v => v < -0.004 ? 'owe' : v > 0.004 ? 'get' : 'ok';

const opKey = o => o.op === 'addGuest' ? 'g:' + (o.data.name || '') : (o.op.indexOf('Expense') > 0 ? 'e:' : 'p:') + (o.id || (o.data && o.data.id));
function qOp(op) {
  if (!syncOn()) return;
  op.id = op.id || (op.data && op.data.id);

  OB.push(op); saveOB(); syncSoon();
}
let syncTimer = null;

function applyOp(st, op) {
  const d = op.data || {};
  if (op.op === 'upsertExpense') { const i = st.expenses.findIndex(x => x.id === d.id); if (i >= 0) st.expenses[i] = d; else st.expenses.push(d); }
  else if (op.op === 'deleteExpense') st.expenses = st.expenses.filter(x => x.id !== op.id);
  else if (op.op === 'upsertPayment') { const i = st.payments.findIndex(x => x.id === d.id); if (i >= 0) st.payments[i] = d; else st.payments.push(d); }
  else if (op.op === 'deletePayment') st.payments = st.payments.filter(x => x.id !== op.id);
  else if (op.op === 'addGuest') { if (!st.guests.some(g => clean(g.name) === clean(d.name))) st.guests.push({ name: d.name, sponsor: d.sponsor || '', open: 0, note: '' }); }
}
function adopt(state) {

  const st = { hub: state.hub, people: state.people, guests: state.guests || [], expenses: state.expenses || [], payments: state.payments || [] };
  st.expenses.forEach(e => { if (e.trip == null) e.trip = ''; delete e.settled; });
  OB.forEach(op => applyOp(st, op));

async function callSheet(ops) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 30000);
  try {
    const r = await fetch(SY.url, { method: 'POST', body: JSON.stringify({ token: SY.token, ops: ops.map(o => ({ op: o.op, id: o.id, data: o.data })) }), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok) { const er = new Error(j.error || 'Sync failed'); er.server = true; throw er; }

}
async function syncNow(manual) {

  if (manual) OB.forEach(o => { delete o.err; });
  const send = OB.filter(o => !o.err);
  syncing = true; renderStatus();
  try {
    const j = await callSheet(send);
    j.results.forEach((res, i) => { const op = send[i]; if (res.ok) OB = OB.filter(x => x !== op); else op.err = res.error || 'could not be saved'; });

function requeueDiff(before, after) {

/* ===== RECEIPT PARSER: text from a bill photo -> { vendor, date, amount } (best effort - the user always confirms) ===== */
function parseReceipt(text, todayStr) {
  const today = todayStr || new Date().toISOString().slice(0, 10);
  const ty = +today.slice(0, 4);
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/[|_~]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const out = { vendor: '', date: '', amount: null, lines: lines.length };

  /* ---- amount ---- */
  const numRe = /(?:^|[^\d.,])(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2}|\d+,\d{2})(?![\d])/g;
  const toNum = s => { s = s.replace(/\s/g, ''); if (/^\d+,\d{2}$/.test(s)) s = s.replace(',', '.'); else s = s.replace(/,/g, ''); return parseFloat(s); };
  const amountsIn = l => { const r = []; let m; numRe.lastIndex = 0; while ((m = numRe.exec(' ' + l))) { const v = toNum(m[1]); if (isFinite(v) && v > 0 && v < 10000000) r.push(v); } return r; };
  const STRONG = /(grand\s*total|total\s*(amount|due|payable|aed|inc|incl)?|amount\s*(due|payable|paid)|net\s*(total|amount|payable)|balance\s*due|to\s*pay|you\s*pay|bill\s*amount|total\s*bill)/i;
  const WEAK = /(sub\s*-?\s*total|total\s*(vat|tax)|vat|tax|discount|change|cash|tender|received|saving|tip|service|round|points|qty|quantity|items?)/i;
  const strong = [], any = [];
  lines.forEach((l, i) => {
    let a = amountsIn(l);
    if (!a.length && STRONG.test(l) && lines[i + 1]) a = amountsIn(lines[i + 1]);
    if (!a.length) return;
    const isStrong = STRONG.test(l) && !/sub\s*-?\s*total|total\s*(vat|tax)|vat\s*total/i.test(l);
    if (isStrong) strong.push(Math.max.apply(null, a));
    if (!WEAK.test(l) || isStrong) any.push(Math.max.apply(null, a));
  });
  if (strong.length) out.amount = Math.max.apply(null, strong);
  else if (any.length) out.amount = Math.max.apply(null, any);
  else { const all = []; lines.forEach(l => amountsIn(l).forEach(v => all.push(v))); if (all.length) out.amount = Math.max.apply(null, all); }

  /* ---- date ---- */

  while ((m = r3.exec(blob))) cands.push([m.index, okD(+m[3], MONS.indexOf(m[2].toLowerCase()) + 1, +m[1])]);

  const SKIP = /(receipt|invoice|tax|trn|vat|tel\b|phone|mob|www\.|http|\.com|date|time|bill\s*no|order|table|cashier|welcome|thank|customer|copy|qty|total|amount|aed|dubai|abu dhabi|sharjah|p\.?o\.? box|street|road|\bst\b|building|mall|floor|shop\s*no)/i;

  S.prefs = S.prefs || {}; S.prefs.lastPayer = e.paid;
  qOp({ op: 'upsertExpense', data: e });
  commit(); const edited = F.id; F = null;
  toast(savedMsg(edited ? 'Bill updated' : 'Bill saved'), true);
  go('bills', { q: '' });
}
function savePay() {
  if (payProblems() || !(Number(PF.amount) > 0)) return;
  snapshot();
  const p = { id: PF.id || uid(), date: PF.date, from_: PF.from_, to: PF.to, amount: Number(PF.amount), note: PF.note.trim() };
  const i = S.payments.findIndex(x => x.id === p.id);
  if (i >= 0) S.payments[i] = p; else S.payments.push(p);
  qOp({ op: 'upsertPayment', data: p });
  commit(); const edited = PF.id; PF = null;
  toast(savedMsg(edited ? 'Payment updated' : 'Payment saved'), true);
  render();
}
function setBind(key, el) {
  const [ns, k] = key.split(':'); const v = el.type === 'checkbox' ? el.checked : el.value;
  if (key === 'q') { UI.q = el.value; const l = $('#billsList'); if (l) l.innerHTML = billsListHtml(); return; }
  if (key === 'tripQ') { UI.tripQ = el.value; const l = $('#billsList'); if (l) l.innerHTML = billsListHtml(); return; }
  if (key === 'stmt') { UI.stmt = el.value; render(); return; }
  if (key === 'stmtFrom') { UI.stmtFrom = el.value; render(); return; }
  if (key === 'stmtTo') { UI.stmtTo = el.value; render(); return; }
  if (key === 'stmtTrip') { UI.stmtTrip = el.value; render(); return; }
  if (key === 'year') { UI.year = +el.value; render(); return; }
  if (key === 'restoreText') { UI.restoreText = el.value; return; }
  if (ns === 'f' && k === 'trip' && v === '__new__') { F.newTrip = true; render(); setTimeout(() => { const i = $('#nt_name'); if (i) i.focus(); }, 30); return; }
  if (ns === 'f') {
    F[k] = v;
    if (k === 'paid' || k === 'paid2') { if (k === 'paid' && F.paid2 === F.paid) F.paid2 = ''; if (el.tagName === 'SELECT') { render(); return; } }
    updatePreview();
  } else if (ns === 'h') {
    if (v === '') delete F.heads[k]; else F.heads[k] = v.replace(',', '.');
    updatePreview();
  } else if (ns === 'ga') {
    F.guestAmt = F.guestAmt || {}; const g = F.guestAmt[k] || { amt: '', plus: false }; g.amt = v.replace(',', '.'); F.guestAmt[k] = g;
    updatePreview();
  } else if (ns === 'pf') {
    PF[k] = v; payWarn();
  }
}
function applyChange(key, el) {
  const [k, i] = key.split(':'); const idx = +i; const v = el.value;
  if (k === 'hub') { S.hub = v; commit(); render(); return; }
  if (k[0] === 'p') {
    const p = S.people[idx]; if (!p) return;
    if (k === 'pn') {
      const n = v.trim();
      if (!n) { toast('Name cannot be empty'); render(); return; }
      if (n.indexOf(',') >= 0) { toast('No commas in a name'); render(); return; }
      if (allNames().some((x, j) => x === n && !(x === p.name))) { toast('That name is already used'); render(); return; }
      if (n !== p.name) { renamePerson(p.name, n); p.name = n; }
    }
    if (k === 'ph') p.heads = N(v) || 0;
    if (k === 'po') p.open = N(v);
    if (k === 'pt') p.note = v;
    if (k === 'pf') p.from_ = v;
    if (k === 'pu') p.until = v;
  } else if (k[0] === 'g') {
    const g = S.guests[idx]; if (!g) return;
    if (k === 'gn') {
      const n = v.trim();
      if (!n || n.indexOf(',') >= 0) { toast('Enter a name without commas'); render(); return; }
      if (allNames().some(x => x === n && x !== g.name)) { toast('That name is already used'); render(); return; }
      if (n !== g.name) { renameGuest(g.name, n); g.name = n; }
    }
    if (k === 'gb') g.sponsor = v;
    if (k === 'go') g.open = N(v);
    if (k === 'gt') g.note = v;
  }
  commit(); render();
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, arg = b.dataset.arg;
  switch (act) {
    case 'nav': nav(arg); break;
    case 'go': go(arg); break;
    case 'undo': doUndo(); break;
    case 'stmt': UI.stmt = arg; go('stmt'); break;
    case 'bill': go('bill', { bill: arg }); break;
    case 'payPlan': { const p = R.plan[+arg]; PF = newPay({ from_: p.from, to: p.to, amount: p.amount.toFixed(2) }); go('pay'); break; }
    case 'editPay': { const p = S.payments.find(x => x.id === arg); PF = newPay({ id: p.id, date: p.date, from_: p.from_, to: p.to, amount: String(p.amount), note: p.note || '' }); render(); window.scrollTo(0, 0); break; }
    case 'cancelPay': PF = null; render(); break;
    case 'savePay': savePay(); break;
    case 'delPay': snapshot(); qOp({ op: 'deletePayment', id: PF.id }); S.payments = S.payments.filter(x => x.id !== PF.id); PF = null; UI.confirm = null; commit(); toast('Payment deleted', true); render(); break;
    case 'askDel': UI.confirm = arg; render(); break;
    case 'split': F.split = arg; F.heads = {}; if (arg === 'Exact') { F.guestSel = []; F.guestAmt = {}; } else if (arg !== 'Fixed+Equal') Object.keys(F.guestAmt || {}).forEach(k => { F.guestAmt[k].plus = false; }); render(); break;
    case 'hm': case 'hp': { const p = S.people.find(x => x.name === arg); const cur = has(F.heads[arg]) ? parseFloat(F.heads[arg]) : N(p.heads); F.heads[arg] = Math.max(0, cur + (act === 'hp' ? 1 : -1)); render(); break; }
    case 'hr': delete F.heads[arg]; render(); break;
    case 'hpl': { const cur = has(F.heads[arg]) ? String(F.heads[arg]).trim() : ''; if (/\+$/.test(cur)) F.heads[arg] = cur.slice(0, -1) === '' ? undefined : cur.slice(0, -1); else if (cur !== '' && cur !== '0') F.heads[arg] = cur + '+'; else { toast('Type the fixed amount first, then tap +rest'); break; } if (F.heads[arg] === undefined) delete F.heads[arg]; render(); break; }
    case 'gpl': { F.guestAmt = F.guestAmt || {}; const g = F.guestAmt[arg] || { amt: '', plus: false }; if (g.amt === '') { toast('Type the guest amount first, then tap +rest'); break; } g.plus = !g.plus; F.guestAmt[arg] = g; render(); break; }
    case 'hz': if (F.heads[arg] === 0) delete F.heads[arg]; else F.heads[arg] = 0; render(); break;
    case 'gsel': { const i = F.guestSel.indexOf(arg); if (i >= 0) { F.guestSel.splice(i, 1); if (F.guestAmt) delete F.guestAmt[arg]; } else F.guestSel.push(arg); render(); break; }
    case 'newGuest': F.newGuest = !F.newGuest; render(); break;
    case 'addGuest': {
      const n = ($('#ng_name').value || '').trim(), by = $('#ng_by').value;
      if (!n || n.indexOf(',') >= 0) { toast('Enter a guest name'); break; }
      if (allNames().indexOf(n) >= 0) { toast('That name is already used'); break; }
      S.guests.push({ name: n, sponsor: by, open: 0, note: '' }); qOp({ op: 'addGuest', data: { name: n, sponsor: by } }); F.guestSel.push(n); F.newGuest = false; commit(); render(); break;
    }
    case 'toggleMore': F.more = !F.more; render(); break;
    case 'saveBill': saveBill(); break;
    case 'cancelEdit': F = null; go('bills'); break;
    case 'editBill': { const e = S.expenses.find(x => x.id === arg); F = formFromExpense(e); go('add'); break; }
    case 'dupBill': { const e = S.expenses.find(x => x.id === arg); F = formFromExpense(e); F.id = null; F.date = today(); go('add'); break; }
    case 'addTrip': {
      const n = ($('#nt_name').value || '').trim().replace(/\s+/g, ' ');
      if (!n) { toast('Type the trip name'); break; }
      const ex = tripNames(S).concat(F.extraTrips || []).find(t => t.toLowerCase() === n.toLowerCase());
      if (ex) { F.trip = ex; } else { F.extraTrips = (F.extraTrips || []).concat([n]); F.trip = n; }
      F.newTrip = false; render(); break;
    }
    case 'pickTrip': F.trip = (F.trip.trim().toLowerCase() === arg.toLowerCase()) ? '' : arg; render(); break;
    case 'period': setPeriod(arg); break;
    case 'tripOpen': go('bills', { tripQ: arg, q: '' }); break;
    case 'delBill': snapshot(); qOp({ op: 'deleteExpense', id: arg }); S.expenses = S.expenses.filter(x => x.id !== arg); UI.confirm = null; commit(); toast('Bill deleted', true); go('bills'); break;
    case 'pdfStmt': stmtPdf(false); break;
    case 'pdfShare': stmtPdf(true); break;
    case 'copyStmt': copyText(stmtText(statement(S, R, UI.stmt, stmtOpts())), 'Statement'); break;
    case 'addPerson': {
      const n = ($('#np_name').value || '').trim(); if (!n || n.indexOf(',') >= 0) { toast('Enter a name'); break; }
      if (allNames().indexOf(n) >= 0) { toast('That name is already used'); break; }
      if (S.people.length >= 12) { toast('Up to 12 friends'); break; }
      S.people.push({ name: n, heads: N($('#np_heads').value) || 1, open: 0, from_: '', until: '', note: '' }); commit(); render(); break;
    }
    case 'delPerson': { const p = S.people[+arg]; const u = usedPerson(p.name);
      if (p.name === S.hub) { toast('The hub cannot be removed'); UI.confirm = null; render(); break; }
      if (u) { toast(p.name + ' is used in ' + u + ' place(s). Set "Active until" instead.'); UI.confirm = null; render(); break; }
      snapshot(); S.people.splice(+arg, 1); UI.confirm = null; commit(); toast('Removed', true); render(); break; }
    case 'addGuest2': {
      const n = ($('#ng2_name').value || '').trim(), by = $('#ng2_by').value;
      if (!n || n.indexOf(',') >= 0) { toast('Enter a name'); break; }
      if (allNames().indexOf(n) >= 0) { toast('That name is already used'); break; }
      S.guests.push({ name: n, sponsor: by, open: 0, note: '' }); qOp({ op: 'addGuest', data: { name: n, sponsor: by } }); commit(); render(); break;
    }
    case 'delGuest': { const g = S.guests[+arg]; const u = usedGuest(g.name);
      if (u) { toast(g.name + ' is used in ' + u + ' place(s), so it stays.'); UI.confirm = null; render(); break; }
      snapshot(); S.guests.splice(+arg, 1); UI.confirm = null; commit(); toast('Removed', true); render(); break; }
    case 'dlBackup': saveFile('group-expenses-backup-' + today() + '.json', backupJson()); S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); break;
    case 'copyBackup': copyText(backupJson(), 'Backup'); S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); break;
    case 'dlExp': saveFile('expenses-' + today() + '.csv', expensesCsv()); break;
    case 'dlPay': saveFile('payments-' + today() + '.csv', paymentsCsv()); break;
    case 'doRestore': {
      try {
        const x = JSON.parse(UI.restoreText.trim());
        if (!x || !x.people || !x.expenses || !x.payments) throw new Error('bad');
        S.hub = x.hub; S.people = x.people; S.guests = x.guests || []; S.expenses = x.expenses; S.payments = x.payments; UI.restoreText = ''; UI.confirm = null; F = null; PF = null;
        S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); toast('Restored ' + S.expenses.length + ' bills'); render();
      } catch (e) { UI.confirm = null; toast('That is not a valid backup'); render(); }
      break;
    }
    case 'doReset': { const x = JSON.parse(JSON.stringify(SEED)); S.hub = x.hub; S.people = x.people; S.guests = x.guests; S.expenses = x.expenses; S.payments = x.payments; UI.confirm = null; F = null; PF = null; commit(); toast('Original data loaded'); render(); break; }
    case 'syncNow': syncNow(true); break;
    case 'connect': {
      const u = ($('#sy_url').value || '').trim(), t = ($('#sy_token').value || '').trim(), m = $('#syMsg');
      if (!/^(https:\/\/|http:\/\/localhost)/.test(u) || !t) { m.innerHTML = '<div class="banner bad">Enter the web app URL (starts with https://) and your secret.</div>'; break; }
      m.innerHTML = '<div class="banner warn">Connecting…</div>';
      const keep = Object.assign({}, SY); SY.url = u; SY.token = t;
      callSheet([]).then(j => {
        S.hub = j.state.hub; S.people = j.state.people; S.guests = j.state.guests; S.expenses = j.state.expenses; S.payments = j.state.payments; OB = [];
        SY.lastSync = Date.now(); SY.lastError = ''; saveSY(); saveOB(); persist(); toast('Connected. ' + S.expenses.length + ' bills loaded.'); recalc(); go('home');
      }).catch(e => { SY = keep; m.innerHTML = '<div class="banner bad">' + esc(e.server ? e.message : 'Could not reach the script. Check the URL and your internet.') + '</div>'; });
      break;
    }
    case 'disconnect': SY = { url: '', token: '', lastSync: 0, lastError: '' }; OB = []; saveSY(); saveOB(); UI.confirm = null; toast('Disconnected. Data stays on this phone.'); render(); break;
    case 'copyModal': { const a = $('#modalText'); a.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { } break; }
    case 'closeModal': UI.modal = null; render(); break;
  }
});
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT') setBind(el.dataset.bind, el); });
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset) return;
  if (el.dataset.scan) { const f = el.files && el.files[0]; if (f) scanBill(f); el.value = ''; return; }
  if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT')) setBind(el.dataset.bind, el);
  else if (el.dataset.bind) setBind(el.dataset.bind, el);
  if (el.dataset.chg) applyChange(el.dataset.chg, el);
});

/* ---------- boot ---------- */
loadSY();
S = load();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
persist();
try { if (window.claude && claude.use) claude.use('downloads').then(d => { DL = d; }, () => { }); } catch (e) { }
render();
if (HOSTED) {
  try {
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
      const had = !!navigator.serviceWorker.controller;

  window.addEventListener('online', () => syncNow(false));
