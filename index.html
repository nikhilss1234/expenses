<style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}main{padding-top:calc(18px + env(safe-area-inset-top,0px))}</style></head><body><div id="app"></div><div id="toast" hidden></div>
<script>
const SEED = {"v":1,"hub":"","people":[],"guests":[],"expenses":[],"payments":[]};
/* ===== ENGINE: same rules as the workbook ===== */
const N = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
const clean = s => String(s == null ? '' : s).replace(/\s/g, '').toLowerCase();
const dnum = s => (s ? Date.parse(s + 'T00:00:00Z') / 86400000 : null);
const has = v => !(v === undefined || v === null || v === '');

function modeOf(e) { return e.split === 'Exact' ? 'Exact' : e.split === 'Fixed+Equal' ? 'Mixed' : 'Equal'; }

/* one bill -> shares */
function billCalc(S, e) {
  const people = S.people.filter(p => p.name);
  const A = N(e.amount), mode = modeOf(e), dn = dnum(e.date);
  const pnames = people.map(p => p.name);
  // guests attending
  const attend = [];
  if (mode !== 'Exact' && e.guests) {
    const toks = String(e.guests).split(/[,;\n]/).map(clean).filter(Boolean);
    S.guests.forEach(g => {
      if (g.name && toks.indexOf(clean(g.name)) >= 0 && g.sponsor && pnames.indexOf(g.sponsor) >= 0) attend.push(g);
    });
  }
  const unknownGuests = [];
  if (mode !== 'Exact' && e.guests) {
    String(e.guests).split(/[,;\n]/).map(t => t.trim()).filter(Boolean).forEach(t => {
      const g = S.guests.find(g => clean(g.name) === clean(t));
      if (!g || !g.sponsor || pnames.indexOf(g.sponsor) < 0) unknownGuests.push(t);
    });
  }
  const gs = {}, ts = {}, own = {}, val = {};
  people.forEach(p => { gs[p.name] = attend.filter(g => g.sponsor === p.name).length; });
  let fx = 0, otot = 0;
  people.forEach(p => {
    const v = (e.heads || {})[p.name];
    val[p.name] = v;
    const excl = dn !== null && ((p.from_ && dn < dnum(p.from_)) || (p.until && dn > dnum(p.until)));
    let t;
    if (mode === 'Exact') t = N(v);
    else if (!has(v)) t = (excl ? 0 : N(p.heads)) + gs[p.name];
    else t = mode === 'Mixed' ? gs[p.name] : Math.max(N(v), gs[p.name]);
    ts[p.name] = t; otot += t;
    if (mode === 'Mixed') fx += N(v);
  });
  const perh = (A === 0 || otot === 0 || mode === 'Exact') ? 0 : (A - fx) / otot;
  people.forEach(p => {
    if (A === 0) own[p.name] = 0;
    else if (mode === 'Exact') own[p.name] = ts[p.name];
    else own[p.name] = (mode === 'Mixed' ? N(val[p.name]) : 0) + (otot === 0 ? 0 : perh * (ts[p.name] - gs[p.name]));
  });
  const guestShare = {};
  attend.forEach(g => { guestShare[g.name] = perh; });
  const gTot = attend.length;
  // payers
  const p2ok = e.paid2 && pnames.indexOf(e.paid2) >= 0;
  const a2 = p2ok ? Math.min(N(e.amt2), A) : 0;
  const a1 = A - a2;
  // problems
  const warn = [];
  if (!e.date) warn.push('Enter a date');
  if (!A) warn.push('Enter the amount');
  if (A && pnames.indexOf(e.paid) < 0) warn.push('Choose who paid');
  if (e.paid2 && !p2ok) warn.push('Choose the 2nd payer from the list');
  if (p2ok && e.paid2 === e.paid) warn.push('2nd payer is the same person');
  if (p2ok && (N(e.amt2) <= 0 || N(e.amt2) >= A)) warn.push('2nd payer amount must be more than 0 and less than the bill');
  if (!e.paid2 && N(e.amt2) > 0) warn.push('Choose who paid the 2nd part');
  if (unknownGuests.length) warn.push('Guest not found or has no friend selected: ' + unknownGuests.join(', '));
  if (A) {
    if (mode === 'Exact') { if (Math.abs(A - otot) >= 0.01) warn.push('Amounts differ from the bill by ' + (A - otot).toFixed(2)); }
    else if (mode === 'Mixed') {
      if (fx === 0) warn.push('Type a fixed amount for at least one person (or use Equal)');
      else if (fx > A + 0.005) warn.push('Fixed amounts (' + fx.toFixed(2) + ') are more than the bill');
      else if (otot === 0 && Math.abs(A - fx) >= 0.01) warn.push('Nobody is left to share the remaining ' + (A - fx).toFixed(2));
    } else if (otot === 0) warn.push('Nobody is sharing');
  }
  return { A, mode, gs, ts, own, perh, otot, fx, attend, guestShare, gTot, a1, a2, p2: p2ok ? e.paid2 : '', warn, val };
}

/* everything */
function compute(S) {
  const people = S.people.filter(p => p.name);
  const guests = S.guests.filter(g => g.name);
  const pnames = people.map(p => p.name);
  const bills = S.expenses.map(e => ({ e, c: billCalc(S, e) }));
  const ent = [];
  people.forEach(p => ent.push({ name: p.name, guest: false, sponsor: '', via: p.name, open: N(p.open), paid: 0, share: 0, sent: 0, recv: 0 }));
  guests.forEach(g => {
    const sp = g.sponsor && pnames.indexOf(g.sponsor) >= 0 ? g.sponsor : '';
    ent.push({ name: g.name, guest: true, sponsor: sp, via: sp || g.name, open: N(g.open), paid: 0, share: 0, sent: 0, recv: 0 });
  });
  const byName = {};
  ent.forEach(x => { if (!byName[x.name]) byName[x.name] = x; });
  bills.forEach(({ e, c }) => {
    if (e.settled) return;
    if (c.a1 && byName[e.paid] && !byName[e.paid].guest) byName[e.paid].paid += c.a1;
    if (c.a2 && byName[c.p2]) byName[c.p2].paid += c.a2;
    people.forEach(p => { byName[p.name].share += c.own[p.name]; });
    Object.keys(c.guestShare).forEach(n => { if (byName[n]) byName[n].share += c.guestShare[n]; });
  });
  S.payments.forEach(p => {
    const a = N(p.amount); if (a <= 0) return;
    if (byName[p.from_]) byName[p.from_].sent += a;
    if (byName[p.to]) byName[p.to].recv += a;
  });
  ent.forEach(x => { x.net = r2(x.open + x.paid - x.share + x.sent - x.recv); });
  // plan
  const plan = [];
  people.forEach(p => {
    if (p.name === S.hub) return;
    const grp = ent.filter(x => x.via === p.name);
    const O = r2(grp.reduce((s, x) => s + x.net, 0));
    if (Math.abs(O) < 0.005) return;
    const own = byName[p.name];
    let det = 'Own: ' + (own.net < -0.004 ? 'owes ' : 'gets ') + Math.abs(own.net).toFixed(2);
    const gl = ent.filter(x => x.guest && x.sponsor === p.name && Math.abs(x.net) >= 0.005);
    gl.forEach(x => { det += '; ' + x.name + (x.net < -0.004 ? ' owes ' : ' gets ') + Math.abs(x.net).toFixed(2); });
    plan.push({ person: p.name, from: O < 0 ? p.name : S.hub, to: O < 0 ? S.hub : p.name, amount: Math.abs(O), detail: gl.length ? det : '' , net: O });
  });
  const groupNet = {};
  people.forEach(p => { groupNet[p.name] = r2(ent.filter(x => x.via === p.name).reduce((s, x) => s + x.net, 0)); });
  return { people, guests, bills, ent, byName, plan, groupNet };
}

/* one person's statement (plain positive numbers) */
function statement(S, R, name, showAll) {
  const me = R.byName[name]; if (!me) return null;
  const inGroup = n => { const x = R.byName[n]; if (!x) return false; return me.guest ? x.name === name : x.via === name; };
  const grp = R.ent.filter(x => me.guest ? x.name === name : x.via === name);
  const sum = k => grp.reduce((s, x) => s + x[k], 0);
  const opening = sum('open'), paidAll = sum('paid'), shareAll = sum('share');
  let made = 0, recv = 0;
  const madeL = [], recvL = [];
  S.payments.forEach(p => {
    const a = N(p.amount); if (a <= 0) return;
    const f = inGroup(p.from_), t = inGroup(p.to);
    if (f && !t) { made += a; madeL.push(p); } else if (!f && t) { recv += a; recvL.push(p); }
  });
  const sortD = (a, b) => (a.date || '9999').localeCompare(b.date || '9999');
  madeL.sort(sortD); recvL.sort(sortD);
  const ownShare = me.share;
  const A = {
    own: ownShare, guests: shareAll - ownShare, oldOwed: Math.max(0, -opening), recvBack: recv
  };
  A.total = A.own + A.guests + A.oldOwed + A.recvBack;
  const B = { bills: paidAll, made: made, oldCredit: Math.max(0, opening) };
  B.total = B.bills + B.made + B.oldCredit;
  const diff = r2(A.total - B.total);
  const toPay = Math.max(0, diff), toGet = Math.max(0, -diff);
  const payVia = me.guest ? me.sponsor : (name === S.hub ? '' : S.hub);
  // guests table
  const gl = me.guest ? [] : R.ent.filter(x => x.guest && x.sponsor === name).map(x => ({
    name: x.name, share: x.share, covered: r2(x.share + x.net), collect: Math.max(0, r2(-x.net)), giveBack: Math.max(0, r2(x.net))
  }));
  // bills
  const rows = [];
  R.bills.forEach(({ e, c }) => {
    if (!c.A) return;
    if (!showAll && e.settled) return;
    let grpShare, own;
    if (me.guest) { own = c.guestShare[name] || 0; grpShare = own; }
    else { own = c.own[name] || 0; grpShare = own + c.perh * (c.gs[name] || 0); }
    const paidBy = (e.paid === name ? c.a1 : 0) + (c.p2 === name ? c.a2 : 0);
    if (!(grpShare > 0.00001 || e.paid === name || (c.a2 > 0 && c.p2 === name))) return;
    let heads;
    if (me.guest) heads = 1;
    else if (c.mode === 'Exact') heads = 'Exact';
    else if (c.mode === 'Mixed' && c.ts[name] - c.gs[name] === 0 && own > 0) heads = 'Fixed';
    else heads = c.ts[name] - c.gs[name];
    rows.push({ e, date: e.date, what: e.what, paidText: e.paid + (c.a2 > 0 ? ' + ' + c.p2 : ''), amount: c.A, heads, own, guestsShare: grpShare - own, total: grpShare, paidBy,
      result: r2(grpShare - paidBy) });
  });
  rows.sort(sortD);
  return { name, me, A, B, diff, toPay, toGet, payVia, gl, madeL, recvL, made, recv, rows, groupNet: R.groupNet[name] };
}

function resultSentence(st) {
  if (st.toPay > 0.004) return 'You need to pay AED ' + fmt(st.toPay) + (st.payVia ? ' to ' + st.payVia + '.' : ' to your friends (see Home for who).');
  if (st.toGet > 0.004) return st.payVia ? st.payVia + ' will pay you AED ' + fmt(st.toGet) + '.' : 'AED ' + fmt(st.toGet) + ' is due to you.';
  return 'All settled. Nothing to pay.';
}
function fmt(n) { return Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

/* month-wise */
function monthly(S, R, year) {
  const people = R.people.map(p => p.name);
  const rows = [];
  for (let m = 1; m <= 12; m++) {
    const o = { m, share: {}, guests: 0, spent: 0, paid: {} };
    people.forEach(n => { o.share[n] = 0; o.paid[n] = 0; });
    R.bills.forEach(({ e, c }) => {
      if (!e.date || +e.date.slice(0, 4) !== year || +e.date.slice(5, 7) !== m) return;
      o.spent += c.A;
      people.forEach(n => { o.share[n] += c.own[n] || 0; });
      Object.keys(c.guestShare).forEach(g => { o.guests += c.guestShare[g]; });
      if (c.a1 && o.paid[e.paid] !== undefined) o.paid[e.paid] += c.a1;
      if (c.a2 && o.paid[c.p2] !== undefined) o.paid[c.p2] += c.a2;
    });
    rows.push(o);
  }
  return rows;

  setInterval(() => { if (document.visibilityState === 'visible') syncNow(false); renderStatus(); }, 60000);
  setTimeout(() => syncNow(false), 800);
}
