<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D7A78"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Group Expenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, bottom tab bar, cards on a quiet ground. Amounts in the display face; red/green only for owe/get. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#16232A; --muted:#5A6B72; --line:#DCE3E1;
  --accent:#0D7A78; --accent-ink:#FFFFFF; --accent-soft:#DAEFED;
  --bad:#B3261E; --bad-soft:#FBE5E3; --good:#1B7A2F; --good-soft:#E2F3E5; --warn-soft:#FFF1CC; --warn-ink:#6B4A00;
  --shadow:0 1px 2px rgba(20,35,40,.06),0 6px 18px rgba(20,35,40,.05);
  --disp:'Bricolage Grotesque','Figtree',system-ui,sans-serif; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1719; --surface:#172226; --ink:#E7EEEC; --muted:#9BABA8; --line:#263539;
  --accent:#43BDBA; --accent-ink:#04211F; --accent-soft:#123B3C;
  --bad:#FF9A91; --bad-soft:#3B1D1B; --good:#7ED891; --good-soft:#15331C; --warn-soft:#3A3010; --warn-ink:#F2D58A;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1{font:700 26px/1.1 var(--disp);margin:6px 0 4px;letter-spacing:-.01em}
h2{font:700 15px/1.2 var(--disp);margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
h3{font:600 13px var(--body);color:var(--muted);margin:16px 0 6px}
h4{font:700 13px var(--disp);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.empty{padding:16px;color:var(--muted)}
.list .row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.list .row:last-child{border-bottom:0}
.row.link:active{background:var(--accent-soft)}
.grow{flex:1;min-width:0}
.t{overflow-wrap:anywhere}.s{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.amt{font:700 16px var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.amt2{font-size:14px;text-align:right}
.owe{color:var(--bad);font-weight:600}.get{color:var(--good);font-weight:600}.ok{color:var(--muted)}
.chev{color:var(--muted);font-size:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.stats span{display:block;font-size:11px;color:var(--muted)}.stats b{font:700 15px var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mini{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.banner{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:11px 13px;margin:8px 0;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}.banner.bad{background:var(--bad-soft);color:var(--bad)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
/* forms */
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
label small{font-weight:400}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.ng{grid-template-columns:1fr 1fr;align-items:end}.two.ng .btn{grid-column:1/3}
label.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.people{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.prow:last-child{border-bottom:0}
.prow.hsub{justify-content:space-between;padding-top:0}
.prow.hsub .sv{min-width:64px;text-align:center}
.pn{flex:1;font-weight:600;min-width:0}.pn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.step{display:flex;align-items:center;gap:6px}
.step button,.rs{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;font-weight:600}
.rs{font-size:16px;width:34px;height:34px;color:var(--muted)}.rs.on{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.sv{min-width:62px;text-align:center;font:700 17px var(--disp)}.sv.dim{color:var(--muted)}.sv.off{color:var(--bad);font-size:13px}
.num{width:112px;text-align:right}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip small{color:var(--muted);font-weight:400;margin-left:6px}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on small{color:var(--accent-ink);opacity:.8}
.chip.add{border-style:dashed;color:var(--accent)}
.more{background:none;border:0;text-align:left;color:var(--accent);font-weight:600;padding:2px 0}
.pv{margin-top:12px;padding:12px 14px}.pl{font-weight:600}.pc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px}.pc small{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btns.sticky{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;flex:1;min-width:120px}
.btn.big{padding:14px 18px;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}.btn.danger-t{color:var(--bad)}
.btn:disabled{opacity:.45}
.form .btn{flex:none;width:100%}
/* bills */
.bar{display:flex;gap:12px;align-items:center;margin:10px 0}.bar input,.bar select{flex:1}
.bill{display:block;width:100%;text-align:left;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.bill.done{opacity:.65}
.b1{display:flex;justify-content:space-between;gap:10px}.bw{font-weight:700;overflow-wrap:anywhere}.ba{font:700 16px var(--disp);font-variant-numeric:tabular-nums}
.b2{color:var(--muted);font-size:13px;margin-top:2px}.b3{color:var(--bad);font-size:13px;margin-top:3px}
.tag{position:absolute;right:12px;bottom:9px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
/* statement */
.ab{display:grid;grid-template-columns:1fr;gap:10px}
.blk{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.blk.a h4{color:var(--bad)}.blk.b h4{color:var(--good)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln b{font-variant-numeric:tabular-nums}.ln.tot{border-bottom:0;font-weight:700;padding-top:8px}.ln.hid{display:none}
.res{margin-top:10px;border-radius:14px;padding:14px;text-align:center}
.res.pay{background:var(--bad-soft);color:var(--bad)}.res.get{background:var(--good-soft);color:var(--good)}.res.ok{background:var(--accent-soft);color:var(--accent)}
.res .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.res small{display:block;font-size:12px;opacity:.85}.res b{font:700 24px var(--disp);font-variant-numeric:tabular-nums}
.res p{margin:8px 0 0;font-weight:700;font-size:16px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;font-size:13px;min-width:100%}th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}th{font-weight:700;color:var(--muted);font-size:12px}
tr.tt td{font-weight:700;border-bottom:0}
/* nav, toast, modal */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .nv{flex:1;max-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
nav .nv.on{color:var(--accent)}
nav .fab svg{background:var(--accent);border-radius:50%;padding:6px;width:36px;height:36px;margin-top:-14px;box-shadow:0 3px 10px rgba(13,122,120,.35)}
nav .fab{color:var(--accent)}nav .fab svg{color:var(--accent-ink)}
#toast[hidden]{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:9;max-width:92vw;font-weight:600;font-size:14px}
#toast button{background:none;border:0;color:var(--accent);font-weight:700;filter:brightness(1.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet textarea{font-size:13px}

.chipsync{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;margin:0 0 6px;max-width:100%;text-align:left}
.chipsync i,.stline i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.chipsync.ok i,.stline.ok i{background:var(--good)}.chipsync.wait i,.stline.wait i{background:#E0A100}.chipsync.bad i,.stline.bad i{background:var(--bad)}
.stline{display:flex;align-items:center;gap:8px}
@media (prefers-reduced-motion:no-preference){.btn,.chip,.mini{transition:background .15s}}

/* ===== v8 look: hero header, avatars, pills, timeline statement, floating tab bar ===== */
:root{--grad:linear-gradient(135deg,#0B6E6C 0%,#14978E 55%,#38BFA3 100%);--hero-shadow:0 12px 28px rgba(13,122,120,.26)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grad:linear-gradient(135deg,#0E3F42 0%,#126A68 60%,#1B8B80 100%);--hero-shadow:none}}
:root[data-theme="dark"]{--grad:linear-gradient(135deg,#0E3F42 0%,#126A68 60%,#1B8B80 100%);--hero-shadow:none}
body{background:var(--bg);background-image:radial-gradient(1200px 380px at 50% -140px,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);background-repeat:no-repeat}
main{padding-bottom:130px}
h1{font-size:28px}
h2{margin:26px 0 9px;display:flex;align-items:center;gap:8px}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.card{border-radius:18px}
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border-radius:24px;padding:18px 16px 16px;margin:2px 0 8px;box-shadow:var(--hero-shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero:before{width:190px;height:190px;right:-60px;top:-70px}.hero:after{width:120px;height:120px;left:-40px;bottom:-60px}
.hero>*{position:relative}
.hero h1{color:#fff;margin:3px 0 2px;font-size:26px}.hero small{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.82}
.hero .hsub{margin:0;opacity:.9;font-size:14px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hstats div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18);border-radius:15px;padding:10px 10px 9px;min-width:0}
.hstats span{display:block;font-size:11px;opacity:.88}.hstats b{font:700 17px var(--disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .chipsync{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);color:#fff;margin:12px 0 0}
.hero .chipsync i{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.av{--h:180;display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;border-radius:50%;background:hsl(var(--h) 62% 90%);color:hsl(var(--h) 58% 26%);font:700 16px var(--disp)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 38% 24%);color:hsl(var(--h) 75% 84%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 38% 24%);color:hsl(var(--h) 75% 84%)}
.av.lg{width:48px;height:48px;font-size:20px;background:rgba(255,255,255,.22)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)}
.av.sm{width:30px;height:30px;font-size:13px}
.pair{display:flex;align-items:center;gap:2px;flex:none}.pair i{font-style:normal;color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.owe{background:var(--bad-soft);color:var(--bad)}.pill.get{background:var(--good-soft);color:var(--good)}.pill.ok{background:var(--accent-soft);color:var(--accent)}
.trip{display:inline-block;margin-left:6px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:1px 8px;font-size:11.5px;font-weight:700;vertical-align:1px}
.b2 .trip{margin-left:0}
.list .row{padding:12px 14px}
.row.link:active{background:var(--accent-soft)}
.mini{background:var(--accent-soft);border-color:transparent}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 7px;color:var(--ink)}
.mh span{font:700 15px var(--disp)}.mh b{font:600 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.bill{display:flex;gap:11px;align-items:flex-start;border-radius:16px;box-shadow:var(--shadow);padding:12px 13px}
.bill .bm{flex:1;min-width:0}.bill:active{transform:scale(.99)}
.tico{display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);align-items:center;justify-content:center;flex:none}
.tico svg{width:18px;height:18px}
.sfilter{gap:10px}.who{display:flex;align-items:center;gap:10px}.who select{font-weight:700}
.pchips .chip{padding:6px 11px;font-size:13px}
.res{border-radius:20px;padding:16px 14px;margin-top:12px}
.res>small{display:block;margin-bottom:6px;font-weight:600}
.res b{font-size:26px}
.ab{gap:12px}.blk{border-radius:18px;box-shadow:var(--shadow);padding:13px 15px}
.blk.a{border-top:3px solid var(--bad)}.blk.b{border-top:3px solid var(--good)}
.led{overflow:hidden}
.lr{display:grid;grid-template-columns:44px 1fr auto;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.lr:last-child{border-bottom:0}
.lr.pay{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.lr.open,.lr.close{background:var(--accent-soft)}
.ld{text-align:center;line-height:1.05;padding-top:1px}.ld b{display:block;font:700 19px var(--disp);font-variant-numeric:tabular-nums}.ld span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.lm{min-width:0}.lm .t{line-height:1.25}.lx{text-align:right;font-size:13px;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.lx b{font-variant-numeric:tabular-nums}
.lx .bal{font-size:11.5px;font-weight:600;margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
.bal.owe{color:var(--bad)}.bal.get{color:var(--good)}.bal.ok{color:var(--muted)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;border:1px solid var(--line);border-radius:26px;padding:6px 8px;box-shadow:0 10px 30px rgba(15,30,35,.16);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
nav .nv{border-radius:18px;position:relative;transition:color .15s}
nav .nv.on:not(.fab){color:var(--accent);background:var(--accent-soft)}
nav .fab svg{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(13,122,120,.4);width:40px;height:40px;margin-top:-18px;padding:8px}
.btns.sticky{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.btn{border-radius:14px;background:var(--grad);transition:transform .1s}.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface)}.btn.danger{background:var(--bad)}
.seg button.on{background:var(--grad)}
.chip.on{background:var(--grad);border-color:transparent}
.tchips{margin-top:-4px}
.empty{text-align:center;padding:20px 16px}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
.row.plan{flex-wrap:wrap;row-gap:4px}.row.plan .pd{flex-basis:100%;padding-left:2px;line-height:1.35}

/* ===== v9: guest receivables caption, trip lock, brought-forward strip ===== */
.hstats em{display:block;font:500 10px var(--body, inherit);font-style:normal;opacity:.85;margin-top:2px}
.sfilter.locked .chip[disabled],.sfilter.locked input[disabled]{opacity:.45;pointer-events:none}
.lockhint{margin:2px 2px 8px}
.res .bc{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed rgba(0,0,0,.16);font-size:11px;flex-wrap:wrap}
.res .bc b{display:block;font-size:13px;margin-top:1px}
.hint.tl{text-align:right;margin:4px 8px 0}
.ab.one{grid-template-columns:1fr}
.rs.pls{width:auto;border-radius:17px;padding:0 9px;font-size:12px}.rs.pls.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

<script>
const SEED = {"v":1,"hub":"","people":[],"guests":[],"expenses":[],"payments":[]};
/* ===== ENGINE: same rules as the workbook ===== */
const N = v => { const x = parseFloat(v); return isFinite(x) ? x : 0; };
const r2 = x => { const s = x < 0 ? -1 : 1; return s * Math.round(Math.abs(x) * 100 + 1e-7) / 100; };
const clean = s => String(s == null ? '' : s).replace(/\s/g, '').toLowerCase();
const dnum = s => (s ? Date.parse(s + 'T00:00:00Z') / 86400000 : null);
const has = v => !(v === undefined || v === null || v === '');

/* a typed fixed amount: 200 = fixed only, "200+" = fixed AND an equal share of the rest (the person's usual heads), "200+2" = fixed AND an equal share for 2 heads only */
function fixedOf(v) {
  if (typeof v === 'number') return { amt: isFinite(v) ? v : 0, plus: false, heads: null, bad: false };
  const t = String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.');
  const i = t.indexOf('+');
  if (i < 0) return { amt: N(t), plus: false, heads: null, bad: !/^[0-9]*\.?[0-9]*$/.test(t) };
  const a = parseFloat(t.slice(0, i)), rest = t.slice(i + 1);
  const hv = rest === '' ? null : Number(rest);
  const bad = !/^[0-9]*\.?[0-9]+$|^[0-9]+\.?$/.test(t.slice(0, i)) || (rest !== '' && !(isFinite(hv) && hv >= 0 && /^[0-9.]+$/.test(rest)));
  return { amt: isFinite(a) ? a : 0, plus: true, heads: hv, bad };
}
/* the Guests cell: "Ujjwal=40, Darsh, Kamal=25+" -> [{name, key, amt, plus, bad}] */
function guestTokens(txt) {
  return String(txt || '').split(/[,;\n]/).map(t => t.trim()).filter(Boolean).map(t => {
    const i = t.indexOf('=');
    if (i < 0) return { name: t, key: clean(t), mode: 0, amt: 0 };
    const nm = t.slice(0, i).trim(), raw = t.slice(i + 1).replace(/\s/g, '');
    const plus = /\+$/.test(raw), a = Number(plus ? raw.slice(0, -1) : raw);
    if (raw === '' || !isFinite(a) || a < 0) return { name: nm, key: clean(nm), mode: 9, amt: 0 };
    return { name: nm, key: clean(nm), mode: plus ? 2 : 1, amt: a };
  });
}
function modeOf(e) { return e.split === 'Exact' ? 'Exact' : e.split === 'Fixed+Equal' ? 'Mixed' : 'Equal'; }

/* one bill -> shares */
function billCalc(S, e) {
  const people = S.people.filter(p => p.name);
  const A = N(e.amount), mode = modeOf(e), dn = dnum(e.date);
  const pnames = people.map(p => p.name);
  const payers = pnames.concat(S.guests.filter(g => g.name).map(g => g.name));
  // guests attending
  const attend = [];
  if (mode !== 'Exact' && e.guests) {
    const toks = guestTokens(e.guests).map(t => t.key);
    S.guests.forEach(g => {
      if (g.name && toks.indexOf(clean(g.name)) >= 0 && g.sponsor && pnames.indexOf(g.sponsor) >= 0) attend.push(g);
    });
  }
  const unknownGuests = [];
  if (mode !== 'Exact' && e.guests) {
    guestTokens(e.guests).forEach(tk => {
      const t = tk.name, g = S.guests.find(g => clean(g.name) === clean(t));
      if (!g || !g.sponsor || pnames.indexOf(g.sponsor) < 0) unknownGuests.push(t);
    });
  }
  const gs = {}, gAll = {}, ts = {}, own = {}, val = {};
  const gspec = {}; if (mode !== 'Exact') guestTokens(e.guests).forEach(tk => { gspec[tk.key] = tk; });
  /* a guest typed Name=40 pays only that and is NOT counted in the equal split; Name=40+ pays that AND an equal share; a plain name is an equal share */
  people.forEach(p => { const mine = attend.filter(g => g.sponsor === p.name); gAll[p.name] = mine.length; gs[p.name] = mine.filter(g => (gspec[clean(g.name)] || { mode: 0 }).mode !== 1).length; });
  const plus = {};
  let fx = 0, otot = 0;
  people.forEach(p => {
    const v = (e.heads || {})[p.name];
    val[p.name] = v;
    const excl = dn !== null && ((p.from_ && dn < dnum(p.from_)) || (p.until && dn > dnum(p.until)));
    let t;
    if (mode === 'Exact') t = N(v);
    else if (!has(v)) t = (excl ? 0 : N(p.heads)) + gs[p.name];
    else if (mode === 'Mixed') { const f = fixedOf(v); plus[p.name] = f.plus; t = gs[p.name] + (f.plus && !excl ? (f.heads == null ? N(p.heads) : f.heads) : 0); }
    else t = Math.max(N(v), gs[p.name]);
    ts[p.name] = t; otot += t;
    if (mode === 'Mixed') fx += fixedOf(v).amt;
  });
  attend.forEach(g => { const sp = gspec[clean(g.name)]; if (sp && (sp.mode === 1 || sp.mode === 2)) fx += sp.amt; });
  const perh = (A === 0 || otot === 0 || mode === 'Exact') ? 0 : (A - fx) / otot;
  const guestShare = {}, gsAmt = {};
  let gCust = 0;
  attend.forEach(g => {
    const sp = gspec[clean(g.name)] || { mode: 0 };
    let a = perh; if (sp.mode === 1) a = sp.amt; else if (sp.mode === 2) a = sp.amt + perh;
    if (sp.mode > 0) gCust++;
    if (A === 0) a = 0;
    guestShare[g.name] = a; gsAmt[g.sponsor] = (gsAmt[g.sponsor] || 0) + a;
  });
  people.forEach(p => {
    if (A === 0) own[p.name] = 0;
    else if (mode === 'Exact') own[p.name] = ts[p.name];
    else own[p.name] = (mode === 'Mixed' ? fixedOf(val[p.name]).amt : 0) + (otot === 0 ? 0 : perh * (ts[p.name] - gs[p.name]));
  });
  /* a gift on the bill: giver pays part of the receiver's share.  Receiver's share goes down, giver's goes up; the bill total does not change. */
  const giftIn = {}, giftOut = {}; let gift = null, giftWarn = '';
  const gF = String(e.gfrom || '').trim(), gT = String(e.gto || '').trim(), gA = N(e.gamt);
  if (gF || gT || gA > 0) {
    if (!gF || !gT || !(gA > 0)) giftWarn = 'Gift needs a giver, a receiver and an amount';
    else if (pnames.indexOf(gF) < 0 || pnames.indexOf(gT) < 0) giftWarn = 'Gift: choose the giver and receiver from the friends list';
    else if (gF === gT) giftWarn = 'Gift: giver and receiver are the same person';
    else if (A > 0) {
      const g = r2(Math.min(gA, Math.max(0, own[gT])));
      if (g < gA - 0.005) giftWarn = 'Gift is more than ' + gT + '\'s share on this bill (' + r2(own[gT]).toFixed(2) + '), so only ' + g.toFixed(2) + ' is counted';
      if (g > 0) { own[gT] -= g; own[gF] += g; giftIn[gT] = g; giftOut[gF] = g; gift = { from: gF, to: gT, amt: g, note: String(e.gnote || '').trim() }; }
    }
  }
  const gTot = attend.length;
  // payers
  const p2ok = e.paid2 && payers.indexOf(e.paid2) >= 0;
  const a2 = p2ok ? Math.min(N(e.amt2), A) : 0;
  const px = xpOf(e).filter(x => payers.indexOf(x.n) >= 0 && x.n !== e.paid && x.n !== (p2ok ? e.paid2 : '')), pxSum = px.reduce((t, x) => t + x.a, 0);
  const a1 = A - a2 - pxSum;
  // problems
  const warn = [];
  if (!e.date) warn.push('Enter a date');
  if (!A) warn.push('Enter the amount');
  if (A && payers.indexOf(e.paid) < 0) warn.push('Choose who paid');
  if (e.paid2 && !p2ok) warn.push('Choose the 2nd payer from the list');
  if (p2ok && e.paid2 === e.paid) warn.push('2nd payer is the same person');
  if (p2ok && (N(e.amt2) <= 0 || N(e.amt2) >= A)) warn.push('2nd payer amount must be more than 0 and less than the bill');
  if (xpOf(e).length && (px.length !== xpOf(e).length)) warn.push('Choose each extra payer once, from the list');
  if (px.length && (!p2ok || a1 <= 0.004)) warn.push(p2ok ? 'The payers\' amounts must add up to less than the bill, so the first payer paid something' : 'Choose the 2nd payer first');
  if (!e.paid2 && N(e.amt2) > 0) warn.push('Choose who paid the 2nd part');
  if (mode !== 'Exact' && guestTokens(e.guests).some(t => t.mode === 9)) warn.push('A guest amount is not a number - write Name=40 or Name=40+');
  if (mode === 'Mixed' && people.some(p => has((e.heads || {})[p.name]) && fixedOf((e.heads || {})[p.name]).bad)) warn.push('A fixed amount is not valid - write 60, 60+ (plus usual heads) or 60+2 (plus 2 heads)');
  if (giftWarn) warn.push(giftWarn);
  if (unknownGuests.length) warn.push('Guest not found or has no friend selected: ' + unknownGuests.join(', '));
  if (A) {
    if (mode === 'Exact') { if (Math.abs(A - otot) >= 0.01) warn.push('Amounts differ from the bill by ' + (A - otot).toFixed(2)); }
    else if (mode === 'Mixed') {
      if (fx === 0) warn.push('Type a fixed amount for at least one person (or use Equal)');
      else if (fx > A + 0.005) warn.push('Fixed amounts (' + fx.toFixed(2) + ') are more than the bill');
      else if (otot === 0 && Math.abs(A - fx) >= 0.01) warn.push('Nobody is left to share the remaining ' + (A - fx).toFixed(2));
    } else if (otot === 0) warn.push('Nobody is sharing');
  }
  return { A, mode, gs, gAll, ts, own, gift, giftIn, giftOut, perh, otot, fx, attend, guestShare, gsAmt, plus, gCust, gTot, a1, a2, px, p2: p2ok ? e.paid2 : '', warn, val };
}

/* everything */
function compute(S) {
  const people = S.people.filter(p => p.name);
  const guests = S.guests.filter(g => g.name);
  const pnames = people.map(p => p.name);
  const bills = S.expenses.map(e => ({ e, c: billCalc(S, e) }));
  const ent = [];
  people.forEach(p => ent.push({ name: p.name, guest: false, sponsor: '', via: p.name, open: N(p.open), paid: 0, share: 0, sent: 0, recv: 0 }));
  guests.forEach(g => {
    const sp = g.sponsor && pnames.indexOf(g.sponsor) >= 0 ? g.sponsor : '';
    ent.push({ name: g.name, guest: true, sponsor: sp, via: sp || g.name, open: N(g.open), paid: 0, share: 0, sent: 0, recv: 0 });
  });
  const byName = {};
  ent.forEach(x => { if (!byName[x.name]) byName[x.name] = x; });
  bills.forEach(({ e, c }) => {
    if (c.a1 && byName[e.paid]) byName[e.paid].paid += c.a1;
    if (c.a2 && byName[c.p2]) byName[c.p2].paid += c.a2;
    (c.px || []).forEach(x => { if (byName[x.n]) byName[x.n].paid += x.a; });
    people.forEach(p => { byName[p.name].share += c.own[p.name]; });
    Object.keys(c.guestShare).forEach(n => { if (byName[n]) byName[n].share += c.guestShare[n]; });
  });
  S.payments.forEach(p => {
    const a = N(p.amount); if (a <= 0) return;
    if (byName[p.from_]) byName[p.from_].sent += a;
    if (byName[p.to]) byName[p.to].recv += a;
  });
  ent.forEach(x => { x.net = r2(x.open + x.paid - x.share + x.sent - x.recv); });
  // plan
  const plan = [];
  people.forEach(p => {
    if (p.name === S.hub) return;
    const grp = ent.filter(x => x.via === p.name);
    const O = r2(grp.reduce((s, x) => s + x.net, 0));
    if (Math.abs(O) < 0.005) return;
    const own = byName[p.name];
    let det = 'Own: ' + (own.net < -0.004 ? 'owes ' : 'gets ') + Math.abs(own.net).toFixed(2);
    const gl = ent.filter(x => x.guest && x.sponsor === p.name && Math.abs(x.net) >= 0.005);
    gl.forEach(x => { det += '; ' + x.name + (x.net < -0.004 ? ' owes ' : ' gets ') + Math.abs(x.net).toFixed(2); });
    plan.push({ person: p.name, from: O < 0 ? p.name : S.hub, to: O < 0 ? S.hub : p.name, amount: Math.abs(O), detail: gl.length ? det : '' , net: O });
  });
  const groupNet = {};
  people.forEach(p => { groupNet[p.name] = r2(ent.filter(x => x.via === p.name).reduce((s, x) => s + x.net, 0)); });
  // the hub's own guests settle directly with the hub (same as the workbook's Dashboard cards)
  const hubGuests = ent.filter(x => x.guest && x.sponsor === S.hub);
  const guestToHub = hubGuests.reduce((s, x) => s + (x.net < -0.004 ? -x.net : 0), 0);
  const guestFromHub = hubGuests.reduce((s, x) => s + (x.net > 0.004 ? x.net : 0), 0);
  return { people, guests, bills, ent, byName, plan, groupNet, guestToHub, guestFromHub };
}

/* one person's statement.  opts = { from:'YYYY-MM-DD'|'', to:'', trip:'' }
   A trip means: only that trip's bills and its total - no dates, no opening/closing balance, no payments. */
const effd = s => { const d = dnum(s); return d === null ? 1e9 : d; };
function statement(S, R, name, opts) {
  const me = R.byName[name]; if (!me) return null;
  opts = opts || {};
  const tripName = (opts.trip && opts.trip !== 'All trips') ? String(opts.trip).trim() : '';
  const trip = tripName.toLowerCase();
  const tripMode = !!trip;
  const FROM = (!tripMode && opts.from) ? dnum(opts.from) : -1e9, TO = (!tripMode && opts.to) ? dnum(opts.to) : 1e9;
  const inGroup = n => { const x = R.byName[n]; if (!x) return false; return me.guest ? x.name === name : x.via === name; };
  const grp = R.ent.filter(x => me.guest ? x.name === name : x.via === name);
  const opening0 = grp.reduce((s, x) => s + x.open, 0);
  const tripOf = e => String(e.trip || '').trim().toLowerCase();
  let sharePre = 0, paidPre = 0, sharePer = 0, ownPer = 0, paidPer = 0, tripTotal = 0;
  const bills = [];
  const T = { amount: 0, own: 0, guests: 0, share: 0, paid: 0, giftIn: 0, giftOut: 0 };

function tripsSummary(S, R) {

  if (st.tripMode) return 'Trip ' + st.tripName + ': the group spent AED ' + fmt(st.tripTotal) + ' in total. Your total share is AED ' + fmt(st.totals.share) + '.';

/* month-wise */
function monthly(S, R, year) {

/* ===== ASK: answers questions from the data in the app. No internet, no AI service - it only reads the bills on this phone.

var ASK_STOP = ('a an the is are was were be been am do does did done have has had will would can could should of on in at for to from by with and or but if as than then so that this these those it its my me mine i we us our you your he she they them his her their what whats which who whom whose when where why how much many more less most least any all some also please tell show give list find get see about between into over under after before during till until up down out off very just only really there here came come comes coming go went gone attend attended join joined part total expense expenses spend spent spending cost costs bill bills transaction transactions amount aed dirham dirhams rs share shares paid pay pays payer owe owes owed balance due biggest largest highest maximum max costliest top expensive trip trips settle settlement outstanding collect alone solo family wife kids children child son daughter himself herself themselves smallest lowest cheapest least payment payments statement account opening closing received transfer who whose where which came single without along each every list shows showing items item entries entry purchase purchases particular specific certain given other another really actually exactly name names not never didn wasn weren isn missed absent skipped except excluding part parts anything everything something').split(' ');

/* find dates in the question. returns { from, to, label, rest } or null */
function askDates(q) {

/* ===== RECEIPT PARSER: text from a bill photo -> { vendor, date, amount } (best effort - the user always confirms) ===== */
function parseReceipt(text, todayStr) {
  const today = todayStr || new Date().toISOString().slice(0, 10);
  const ty = +today.slice(0, 4);
  const lines = String(text || '').split(/\r?\n/).map(l => l.replace(/[|_~]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const out = { vendor: '', date: '', amount: null, lines: lines.length };

  /* ---- amount ---- */
  const numRe = /(?:^|[^\d.,])(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2}|\d+,\d{2})(?![\d])/g;
  const toNum = s => { s = s.replace(/\s/g, ''); if (/^\d+,\d{2}$/.test(s)) s = s.replace(',', '.'); else s = s.replace(/,/g, ''); return parseFloat(s); };
  const amountsIn = l => { const r = []; let m; numRe.lastIndex = 0; while ((m = numRe.exec(' ' + l))) { const v = toNum(m[1]); if (isFinite(v) && v > 0 && v < 10000000) r.push(v); } return r; };
  const STRONG = /(grand\s*total|total\s*(amount|due|payable|aed|inc|incl)?|amount\s*(due|payable|paid)|net\s*(total|amount|payable)|balance\s*due|to\s*pay|you\s*pay|bill\s*amount|total\s*bill)/i;
  const WEAK = /(sub\s*-?\s*total|total\s*(vat|tax)|vat|tax|discount|change|cash|tender|received|saving|tip|service|round|points|qty|quantity|items?)/i;
  const strong = [], any = [];
  lines.forEach((l, i) => {
    let a = amountsIn(l);
    if (!a.length && STRONG.test(l) && lines[i + 1]) a = amountsIn(lines[i + 1]);
    if (!a.length) return;
    const isStrong = STRONG.test(l) && !/sub\s*-?\s*total|total\s*(vat|tax)|vat\s*total/i.test(l);
    if (isStrong) strong.push(Math.max.apply(null, a));
    if (!WEAK.test(l) || isStrong) any.push(Math.max.apply(null, a));
  });
  if (strong.length) out.amount = Math.max.apply(null, strong);
  else if (any.length) out.amount = Math.max.apply(null, any);
  else { const all = []; lines.forEach(l => amountsIn(l).forEach(v => all.push(v))); if (all.length) out.amount = Math.max.apply(null, all); }

    case 'catStarter': setCats(STARTER_CATS.map(a => ({ name: a[0], kw: a[1] }))); toast('Starter categories added'); render(); break;
    case 'catAdd': { const nm = (($('#cn_new') || {}).value || '').trim(); if (!nm) { toast('Type a category name'); break; } if ((S.cats || []).some(c => c.name.toLowerCase() === nm.toLowerCase())) { toast('That category exists'); break; } setCats((S.cats || []).concat([{ name: nm, kw: (($('#ck_new') || {}).value || '').trim() }])); toast('Added'); render(); break; }
    case 'catSave': { const i = +arg, old = S.cats[i], nm = (($('#cn_' + i) || {}).value || '').trim(); if (!nm) { toast('Name cannot be empty'); break; } const arr = JSON.parse(JSON.stringify(S.cats)); arr[i] = { name: nm, kw: (($('#ck_' + i) || {}).value || '').trim() };
      if (old && old.name !== nm) { snapshot(); S.expenses.forEach(e => { if (e.cat === old.name) { e.cat = nm; qOp({ op: 'upsertExpense', data: e }); } }); }
      setCats(arr); commit(); toast('Saved'); render(); break; }
    case 'catDel': { const old = S.cats[+arg]; const arr = S.cats.filter((c, j) => j !== +arg); setCats(arr); UI.confirm = null; toast('Deleted. Bills keep the name until you change them.'); render(); break; }
    case 'catScan': { UI.catPick = {}; S.expenses.filter(e => !e.cat).forEach(e => { const sg = suggestCat(billText(e)); if (sg) UI.catPick[e.id] = sg; }); toast(Object.keys(UI.catPick).length + ' suggested'); render(); break; }
    case 'catScanX': UI.catPick = null; render(); break;
    case 'catApply': { const ids = Object.keys(UI.catPick || {}).filter(k => UI.catPick[k]); if (!ids.length) break; snapshot(); ids.forEach(id => { const e = S.expenses.find(x => x.id === id); if (e) { e.cat = UI.catPick[id]; qOp({ op: 'upsertExpense', data: e }); } }); UI.catPick = null; commit(); toast(ids.length + ' bills categorised', true); render(); break; }
    case 'mvScope': UI.mvScope = arg; UI.mvMonth = null; render(); break;
    case 'mvOpen': UI.mvMonth = arg; window.scrollTo(0, 0); render(); break;
    case 'mvBack': UI.mvMonth = null; render(); break;
    case 'mvShift': { const [y, mo] = (UI.mvMonth || today().slice(0, 7)).split('-').map(Number), t = y * 12 + (mo - 1) + (+arg), n = Math.floor(t / 12) + '-' + String(t % 12 + 1).padStart(2, '0'); if (n <= today().slice(0, 7)) UI.mvMonth = n; render(); break; }
    case 'xpAdd': F.xp = (F.xp || []).concat([{ n: '', a: '' }]); render(); break;
    case 'xpDel': F.xp.splice(+arg, 1); render(); break;
    case 'aop': { const inp = $('#f_amount'); if (!inp) break; let v = inp.value.trim(); if (arg === '(' || arg === ')') v += arg; else { if (v === '' || v === '(') { toast('Type the first amount, then choose + − × ÷'); inp.focus(); break; } v = /[+\-*\/]$/.test(v) ? v.slice(0, -1) + arg : v + arg; } inp.value = v; setBind('f:amount', inp); inp.focus(); break; }
    case 'rcpFormDel': F.rcp = ''; render(); break;
    case 'cpAdd': { const ti = tripInfo(F.trip), x = cashParts().find(y => y.n === arg); if (!x) break; const have = cashHave(F.trip, arg, F.date || today(), F.id || ''); F.cp = (F.cp || []).concat([{ n: arg, a: String(r2(Math.max(0, x.a - Math.max(0, have)))), r: cardRate(ti) }]); render(); break; }
    case 'cpDel': F.cp.splice(+arg, 1); render(); break;
    case 'borrowAdd': { const sl = slug(arg), from = ($('#bl_' + sl) || {}).value, amt = N(($('#ba_' + sl) || {}).value); if (!from || !(amt > 0)) { toast('Choose who lends and the amount'); break; } const ti = tripInfo(F.trip), have = cashHave(F.trip, from, F.date || today(), F.id || '') - (F.borrow || []).filter(b => b.from === from).reduce((t, b) => t + b.amt, 0) + (F.borrow || []).filter(b => b.to === from).reduce((t, b) => t + b.amt, 0); if (have < amt - 0.004) { toast(from + ' has only ' + ti.cur + ' ' + money(Math.max(0, have))); break; } F.borrow = (F.borrow || []).concat([{ from, to: arg, amt: r2(amt) }]); render(); break; }
    case 'borrowDel': F.borrow.splice(+arg, 1); render(); break;
    case 'p2Tog': F.p2open = true; render(); break;
    case 'payCash': F.cp = []; F.pay = 'cash'; applyPay(tripInfo(F.trip)); render(); break;
    case 'payCard': { F.cp = []; F.pay = 'card'; const ti = tripInfo(F.trip); F.fx = ti.cur; F.fxr = cardRate(ti); render(); break; }
    case 'fxOff': F.fx = ''; render(); break;
    case 'fxOn': { const ti = tripInfo(F.trip); if (isFx(ti)) { F.fx = ti.cur; F.fxr = F.fxr || cardRate(ti); render(); } break; }
    case 'fxRem': F.fxRem = F.fxRem === false ? true : false; render(); break;
    case 'fxCalc': { const a = Number((($('#fx_a') || {}).value || '').replace(',', '.')), b = Number((($('#fx_b') || {}).value || '').replace(',', '.')); if (!(a > 0 && b > 0)) { toast('Type both amounts'); break; } F.fxr = String(Math.round(b / a * 10000) / 10000); toast('Rate set: 1 AED = ' + F.fxr + ' ' + F.fx); render(); break; }
    case 'tripSet': UI.tripSet = arg; go('tripset'); break;
    case 'tripOpen': go('bills', { tripQ: arg, q: '', dFrom: '', dTo: '' }); break;
    case 'clrFilt': UI.q = ''; UI.tripQ = ''; UI.allB = false; UI.dFrom = ''; UI.dTo = ''; render(); break;
    case 'askGo': { const i = $('#askq'); askRun(i ? i.value : UI.askQ); break; }
    case 'askMic': askMic(); break;
    case 'askSay': askSayToggle(); break;
    case 'askVoiceTog': askVoiceSet(b.checked); break;
    case 'askEg': UI.askQ = arg; askRun(arg); { const i = $('#askq'); if (i) i.value = arg; } break;
    case 'delBill': if (isFriend()) { friendDelete('bill', arg); break; } snapshot(); removeBorrowAll(arg); { const dm = (($('#del_msg') || {}).value || '').trim(); setChMsg(arg, dm); } tellSet('delete', 'bill', S.expenses.find(x => x.id === arg)); qOp({ op: 'deleteExpense', id: arg }); S.expenses = S.expenses.filter(x => x.id !== arg); UI.confirm = null; commit(); toast('Bill deleted', true); go('bills'); break;
    case 'pdfStmt': stmtPdf(false); break;
    case 'pdfShare': stmtPdf(true); break;
    case 'copyStmt': copyText(stmtText(statement(S, R, UI.stmt, stmtOpts())), 'Statement'); break;
    case 'addPerson': {
      const n = ($('#np_name').value || '').trim(); if (!n || n.indexOf(',') >= 0) { toast('Enter a name'); break; }
      if (allNames().indexOf(n) >= 0) { toast('That name is already used'); break; }
      if (S.people.length >= 12) { toast('Up to 12 friends'); break; }
      S.people.push({ name: n, heads: N($('#np_heads').value) || 1, open: 0, from_: '', until: '', note: '' }); commit(); render(); break;
    }
    case 'delPerson': { const p = S.people[+arg]; const u = usedPerson(p.name);
      if (p.name === S.hub) { toast('The hub cannot be removed'); UI.confirm = null; render(); break; }
      if (u) { toast(p.name + ' is used in ' + u + ' place(s). Set "Active until" instead.'); UI.confirm = null; render(); break; }
      snapshot(); S.people.splice(+arg, 1); UI.confirm = null; commit(); toast('Removed', true); render(); break; }
    case 'addGuest2': {
      const n = ($('#ng2_name').value || '').trim(), by = $('#ng2_by').value;
      if (!n || n.indexOf(',') >= 0) { toast('Enter a name'); break; }
      if (allNames().indexOf(n) >= 0) { toast('That name is already used'); break; }
      S.guests.push({ name: n, sponsor: by, open: 0, note: '' }); qOp({ op: 'addGuest', data: { name: n, sponsor: by } }); commit(); render(); break;
    }
    case 'delGuest': { const g = S.guests[+arg]; const u = usedGuest(g.name);
      if (u) { toast(g.name + ' is used in ' + u + ' place(s), so it stays.'); UI.confirm = null; render(); break; }
      snapshot(); S.guests.splice(+arg, 1); UI.confirm = null; commit(); toast('Removed', true); render(); break; }
    case 'dlBackup': saveFile('group-expenses-backup-' + today() + '.json', backupJson()); S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); break;
    case 'copyBackup': copyText(backupJson(), 'Backup'); S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); break;
    case 'dlExp': saveFile('expenses-' + today() + '.csv', expensesCsv()); break;
    case 'dlPay': saveFile('payments-' + today() + '.csv', paymentsCsv()); break;
    case 'doRestore': { if (isFriend()) break;
      try {
        const x = JSON.parse(UI.restoreText.trim());
        if (!x || !x.people || !x.expenses || !x.payments) throw new Error('bad');
        S.hub = x.hub; S.people = x.people; S.guests = x.guests || []; S.expenses = x.expenses; S.payments = x.payments; UI.restoreText = ''; UI.confirm = null; F = null; PF = null;
        S.meta.lastBackup = Date.now(); S.meta.changes = 0; persist(); toast('Restored ' + S.expenses.length + ' bills'); render();
      } catch (e) { UI.confirm = null; toast('That is not a valid backup'); render(); }
      break;
    }
    case 'doReset': { if (isFriend()) break; const x = JSON.parse(JSON.stringify(SEED)); S.hub = x.hub; S.people = x.people; S.guests = x.guests; S.expenses = x.expenses; S.payments = x.payments; UI.confirm = null; F = null; PF = null; commit(); toast('Original data loaded'); render(); break; }
    case 'syncNow': syncNow(true); break;
    case 'connect': {
      const u = ($('#sy_url').value || '').trim(), t = ($('#sy_token').value || '').trim(), m = $('#syMsg');
      if (!/^(https:\/\/|http:\/\/localhost)/.test(u) || !t) { m.innerHTML = '<div class="banner bad">Enter the web app URL (starts with https://) and your secret.</div>'; break; }
      m.innerHTML = '<div class="banner warn">Connecting…</div>';
      const keep = Object.assign({}, SY); SY.url = u; SY.token = t; SY.role = 'admin';
      callSheet([]).then(j => {
        S.hub = j.state.hub; S.people = j.state.people; S.guests = j.state.guests; S.expenses = j.state.expenses; S.payments = j.state.payments; OB = []; DR = (j.drafts || []).filter(x => x.status !== 'Withdrawn'); saveDR();
        SY.role = j.role || 'admin'; SY.name = j.name || '';
        SY.lastSync = Date.now(); SY.lastError = ''; saveSY(); saveOB(); persist(); toast(SY.role === 'friend' ? 'Connected as ' + SY.name + '. New bills and payments go to ' + S.hub + ' for approval.' : 'Connected. ' + S.expenses.length + ' bills loaded.'); recalc(); go('home');
      }).catch(e => { SY = keep; m.innerHTML = '<div class="banner bad">' + esc(e.server ? e.message : 'Could not reach the script. Check the URL and your internet.') + '</div>'; });
      break;
    }
    case 'disconnect': SY = { url: '', token: '', lastSync: 0, lastError: '', role: 'admin', name: '' }; OB = []; DR = []; saveDR(); saveSY(); saveOB(); UI.confirm = null; toast('Disconnected. Data stays on this phone.'); render(); break;
    case 'copyModal': { const a = $('#modalText'); a.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { } break; }
    case 'closeModal': UI.modal = null; render(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target && ev.target.id === 'askq') { ev.preventDefault(); askRun(ev.target.value); ev.target.blur(); } });
document.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT') setBind(el.dataset.bind, el); });
document.addEventListener('change', ev => {
  const el = ev.target; if (!el.dataset) return;
  if (el.dataset.rcp) { const f = el.files && el.files[0], id = el.dataset.rcp; el.value = ''; if (f && !isFriend()) shrinkImage(f).then(img => { qOp({ op: 'setReceipt', id, data: { img } }); UI.rcpShow = id; toast('Receipt saved'); render(); }).catch(() => toast('Could not use that picture')); return; }
  if (el.dataset.rcpf) { const f = el.files && el.files[0]; el.value = ''; if (f) shrinkImage(f, isFriend() ? 24000 : 48000).then(img => { F.rcp = img; render(); }).catch(() => toast('Could not use that picture. Try another.')); return; }
  if (el.dataset.bind && (el.type === 'checkbox' || el.tagName === 'SELECT')) setBind(el.dataset.bind, el);
  else if (el.dataset.bind) setBind(el.dataset.bind, el);
  if (el.dataset.chg) applyChange(el.dataset.chg, el);
});

/* ---------- boot ---------- */
loadSY();
S = load();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
persist();
try { if (window.claude && claude.use) claude.use('downloads').then(d => { DL = d; }, () => { }); } catch (e) { }
render();
if (HOSTED) {
  try {
    if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then(r => { try { r.update(); } catch (e) { } }).catch(() => { });
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !window.__swReloaded && !F && !PF) { window.__swReloaded = true; location.reload(); } });
    }
  } catch (e) { }
  window.addEventListener('online', () => syncNow(false));
  window.addEventListener('offline', renderStatus);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(false); });
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(false); renderStatus(); }, 60000);
  setTimeout(() => syncNow(false), 800);
}
